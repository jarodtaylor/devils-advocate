version: 2
updates:
  # npm (devDependencies only — no runtime deps in this repo)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # TypeScript major bumps often precede @types/* catch-up releases.
      # Our checkJs + JSDoc workflow works fine on the current 5.x line.
      # Remove this ignore when we explicitly decide to upgrade to TS 6+.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(actions)"
